services:
  api:
    build: .
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    volumes:
      - videoviral-data:/app/storage
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  videoviral-data:
  caddy-data:
  caddy-config:

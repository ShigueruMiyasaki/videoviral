<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VideoViral</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #14141c;
      --border: #2a2a38;
      --accent: #8b5cf6;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 1.25rem 1.5rem; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.75rem; }
    h1 { margin: 0; font-size: 1.35rem; }
    .badge { background: var(--accent); color: #fff; font-size: 0.65rem; padding: 0.2rem 0.5rem; border-radius: 999px; margin-left: 0.5rem; vertical-align: middle; }
    .stats { display: flex; gap: 0.75rem; font-size: 0.8rem; color: var(--muted); }
    .stat { background: var(--card); border: 1px solid var(--border); padding: 0.35rem 0.75rem; border-radius: 8px; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    @media (max-width: 1100px) { .board { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .board { grid-template-columns: 1fr; } }
    .column { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0.85rem; min-height: 120px; }
    .column h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 0.75rem; display: flex; justify-content: space-between; }
    .count { background: #27272a; padding: 0.1rem 0.45rem; border-radius: 6px; }
    .card { background: #0c0c12; border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem; margin-bottom: 0.65rem; }
    .card h3 { margin: 0 0 0.35rem; font-size: 0.9rem; }
    .meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.35rem; line-height: 1.4; }
    .script { background: #08080c; padding: 0.65rem; border-radius: 8px; font-size: 0.8rem; border-left: 3px solid var(--accent); margin: 0.5rem 0; }
    .error { color: #fca5a5; font-size: 0.75rem; background: #450a0a; padding: 0.5rem; border-radius: 6px; margin-top: 0.5rem; }
    video { width: 100%; border-radius: 8px; max-height: 200px; background: #000; }
    .progress-wrap { margin: 0.5rem 0; }
    .progress-bar { height: 6px; background: #27272a; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #c084fc); transition: width 0.4s; }
    .progress-label { font-size: 0.7rem; color: var(--muted); margin-top: 0.25rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
    button { border: none; padding: 0.4rem 0.75rem; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.75rem; }
    .btn-approve { background: var(--green); color: #052e16; }
    .btn-reject { background: var(--red); color: #fff; }
    .btn-regen, .btn-retry { background: #3f3f46; color: #fff; }
    select { background: #27272a; color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 0.75rem; padding: 0.35rem; }
    .empty { color: var(--muted); font-size: 0.8rem; padding: 0.5rem 0; }
    .titles { font-size: 0.72rem; color: var(--amber); margin-top: 0.35rem; }
    .live { width: 8px; height: 8px; background: var(--green); border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:1rem">
      <h1>VideoViral <span class="badge">Kanban</span></h1>
      <a href="/setup" style="color:#c4b5fd;font-size:0.85rem">Setup do estúdio</a>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="board">
    <div class="column"><h2>Aguardando <span class="count" id="c-pending">0</span></h2><div id="list-pending"></div></div>
    <div class="column"><h2>Renderizando <span class="live" id="live-dot" style="display:none"></span> <span class="count" id="c-rendering">0</span></h2><div id="list-rendering"></div></div>
    <div class="column"><h2>Prontos <span class="count" id="c-ready">0</span></h2><div id="list-ready"></div></div>
    <div class="column"><h2>Falhou <span class="count" id="c-failed">0</span></h2><div id="list-failed"></div></div>
  </div>
  <script>
    let pollMs = 10000;
    let hasRendering = false;

    function mediaUrl(path) {
      if (!path) return null;
      const p = path.replace(/\\/g, "/");
      const i = p.indexOf("storage/");
      return "/media/" + (i >= 0 ? p.slice(i) : p);
    }

    function progressHtml(job) {
      if (job.status !== "rendering") return "";
      const pct = job.metadata?.render_progress ?? 0;
      const msg = job.metadata?.render_message || job.metadata?.render_stage || "Processando...";
      return `<div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">${msg} (${pct}%)</div>
      </div>`;
    }

    function card(job) {
      const clipSrc = mediaUrl(job.clip_path);
      const outSrc = mediaUrl(job.output_path);
      const preview = (job.status === "ready" || job.status === "published") && outSrc
        ? `<video controls src="${outSrc}"></video>`
        : clipSrc ? `<video controls src="${clipSrc}"></video>` : `<p class="empty">Sem preview</p>`;

      const err = job.metadata?.render_error
        ? `<div class="error">${job.metadata.render_error}</div>` : "";

      const titles = (job.ab_titles || []).length
        ? `<div class="titles">Titulos: ${job.ab_titles.join(" | ")}</div>` : "";

      let actions = "";
      if (job.status === "pending_approval") {
        actions = `
          <button class="btn-approve" onclick="approve('${job.job_id}')">Aprovar</button>
          <button class="btn-reject" onclick="rejectJob('${job.job_id}')">Rejeitar</button>
          <select id="tone-${job.job_id}">
            <option value="sarcastico" ${job.reaction_tone==="sarcastico"?"selected":""}>Sarcastico</option>
            <option value="informativo" ${job.reaction_tone==="informativo"?"selected":""}>Informativo</option>
            <option value="humoristico" ${job.reaction_tone==="humoristico"?"selected":""}>Humor</option>
          </select>
          <button class="btn-regen" onclick="regenerate('${job.job_id}')">Regerar tom</button>`;
      } else if (job.status === "failed") {
        actions = `<button class="btn-retry" onclick="approve('${job.job_id}')">Tentar novamente</button>`;
      } else if (job.status === "ready" && outSrc) {
        actions = `<a href="${outSrc}" download style="color:var(--accent);font-size:0.75rem">Baixar MP4</a>`;
      }

      return `<div class="card">
        <h3>${job.niche}${job.metadata?.interaction_level ? " · nível " + job.metadata.interaction_level : ""} &middot; ${job.job_id}</h3>
        <div class="meta">Score: ${job.sentiment_score?.toFixed?.(0) ?? "-"} &middot; ${job.sentiment_label || ""}</div>
        <div class="meta">${job.hook_text || ""}</div>
        ${preview}
        ${progressHtml(job)}
        <div class="script">${job.reaction_script || "..."}</div>
        ${titles}${err}
        <div class="actions">${actions}</div>
      </div>`;
    }

    function renderList(id, jobs, emptyText) {
      document.getElementById(id).innerHTML = jobs.length
        ? jobs.map(card).join("")
        : `<p class="empty">${emptyText}</p>`;
    }

    async function load() {
      const all = await fetch("/api/jobs").then(r => r.json());
      const pending = all.filter(j => j.status === "pending_approval");
      const rendering = all.filter(j => j.status === "rendering");
      const ready = all.filter(j => j.status === "ready" || j.status === "published");
      const failed = all.filter(j => j.status === "failed");

      document.getElementById("c-pending").textContent = pending.length;
      document.getElementById("c-rendering").textContent = rendering.length;
      document.getElementById("c-ready").textContent = ready.length;
      document.getElementById("c-failed").textContent = failed.length;
      document.getElementById("live-dot").style.display = rendering.length ? "inline-block" : "none";
      document.getElementById("stats").innerHTML = `
        <span class="stat">Total: ${all.length}</span>
        <span class="stat">Atualizado: ${new Date().toLocaleTimeString()}</span>`;

      renderList("list-pending", pending, "Nenhum job aguardando");
      renderList("list-rendering", rendering, "Nenhum render ativo");
      renderList("list-ready", ready, "Nenhum video pronto");
      renderList("list-failed", failed, "Sem falhas");

      const wasRendering = hasRendering;
      hasRendering = rendering.length > 0;
      pollMs = hasRendering ? 2000 : 10000;
      if (hasRendering && !wasRendering) schedulePoll();
    }

    let timer;
    function schedulePoll() {
      clearInterval(timer);
      timer = setInterval(load, pollMs);
    }

    async function approve(id) {
      await fetch("/api/approve/" + id, { method: "POST" });
      pollMs = 2000;
      schedulePoll();
      load();
    }
    async function rejectJob(id) {
      await fetch("/api/reject/" + id, { method: "POST" });
      load();
    }
    async function regenerate(id) {
      const el = document.getElementById("tone-" + id);
      const tone = el ? el.value : "sarcastico";
      await fetch("/api/regenerate/" + id, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tone }),
      });
      load();
    }

    load();
    schedulePoll();
  </script>
</body>
</html>
